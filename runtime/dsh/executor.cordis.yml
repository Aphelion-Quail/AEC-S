# AEC-S 1.0 pinned DSH executor composition. stdout belongs to JSON-RPC.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  disabled: !!js "(() => { for (const key of ['DSH_CWD', 'DSH_SESSION_ROOT']) if (!process.env[key]) throw new Error(`${key} is required`); return false })()"
  config:
    maxTokensAsSuccess: false

# Reuse the DSH credential seam. This resolves the inherited environment first,
# then the owner-only $DSH_HOME/.credentials.yaml store managed by DSH itself.
- id: credentials-local
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    dshHome: !!js process.env.DSH_HOME
    watch: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: aec-s-run-network
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js "!process.env.AEC_S_RUN_MCP_URL || !process.env.AEC_S_RUN_MCP_TOKEN"
  config:
    serverName: aec-s-network
    transport: streamable-http
    url: !!js process.env.AEC_S_RUN_MCP_URL
    headers:
      Authorization: !!js "`Bearer ${process.env.AEC_S_RUN_MCP_TOKEN}`"
    failOnStartupError: true
    reconnect:
      enabled: false

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js "(() => { const value = process.env.DSH_CWD; if (!value) throw new Error('DSH_CWD is required'); return value })()"

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pty
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  config:
    timeoutMs: 300000

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js "(() => { const value = process.env.DSH_CWD; if (!value) throw new Error('DSH_CWD is required'); return value })()"

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: !!js "`You are an AEC-S executor. The only project workspace is ${process.env.DSH_CWD}; never inspect or modify paths outside it. AEC-S owns scope, validation, commit, merge, and decisions.`"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  config:
    timeoutMs: 300000

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000
    description: !!js "`View or edit files only under the AEC-S workspace root ${process.env.DSH_CWD}. Never inspect filesystem root or another directory. Use absolute paths rooted at that workspace.`"

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "(() => { const value = process.env.DSH_SESSION_ROOT; if (!value) throw new Error('DSH_SESSION_ROOT is required'); return value })()"
    compression: none
