# AEC-S 1.0 pinned DSH reviewer composition. It has no filesystem or shell tool.
# AEC-S embeds the bounded review packet in the prompt and verifies the diff again.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: credentials-local
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    dshHome: !!js process.env.DSH_HOME
    watch: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: 'You are an independent read-only AEC-S reviewer. Report observations only.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none
