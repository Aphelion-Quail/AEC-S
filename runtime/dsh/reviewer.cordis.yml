# AEC-S 1.0 pinned DSH reviewer composition. It has no filesystem or shell tool.
# AEC-S embeds the bounded review packet in the prompt and verifies the diff again.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  disabled: !!js "(() => { for (const key of ['DSH_CWD', 'DSH_SESSION_ROOT']) if (!process.env[key]) throw new Error(`${key} is required`); return false })()"
  config:
    maxTokensAsSuccess: false

- id: credentials-local
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    dshHome: !!js process.env.DSH_HOME
    watch: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: aec-s-run-network
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js "!process.env.AEC_S_RUN_MCP_URL || !process.env.AEC_S_RUN_MCP_TOKEN"
  config:
    serverName: aec-s-network
    transport: streamable-http
    url: !!js process.env.AEC_S_RUN_MCP_URL
    headers:
      Authorization: !!js "`Bearer ${process.env.AEC_S_RUN_MCP_TOKEN}`"
    failOnStartupError: true
    reconnect:
      enabled: false

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: 'You are an independent read-only AEC-S reviewer. Report observations only.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "(() => { const value = process.env.DSH_SESSION_ROOT; if (!value) throw new Error('DSH_SESSION_ROOT is required'); return value })()"
    compression: none
